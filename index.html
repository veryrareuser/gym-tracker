<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https://raw.githubusercontent.com data:; connect-src 'self' https://riogpgsstcafsvhikjhg.supabase.co; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; upgrade-insecure-requests" />
    <meta name="referrer" content="no-referrer" />
    <!-- user-scalable is intentionally omitted: blocking pinch-zoom fails WCAG 1.4.4. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Default, not black-translucent: this app's canvas is light, and translucent
         status-bar text is white, which is unreadable on it. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Gym Tracker" />
    <meta name="description" content="Personal gym progress tracker" />
    <title>Gym Tracker</title>
    <link rel="icon" type="image/svg+xml" href="/gym-tracker/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/gym-tracker/icons/apple-touch-icon.png" />
    <!-- .json rather than .webmanifest: GitHub Pages serves it as application/json,
         which every installer accepts. -->
    <link rel="manifest" href="/gym-tracker/manifest.json" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
